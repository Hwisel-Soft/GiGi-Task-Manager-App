name: GiGi
options:
  bundleIdPrefix: com.johnnassar
  deploymentTarget:
    iOS: "17.0"
targets:
  GiGi:
    type: application
    platform: iOS
    sources:
      - path: GiGi
    info:
      path: Generated-Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDefault
        NSCalendarsFullAccessUsageDescription: "GiGi adds your booked tasks to your calendar so you can see them alongside other events."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnnassar.GiGi
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 4K75SW3E4S
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
schemes:
  GiGi:
    build:
      targets:
        GiGi: all
    run:
      config: Debug
    archive:
      config: Release
